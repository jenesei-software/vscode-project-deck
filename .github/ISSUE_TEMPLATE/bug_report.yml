name: Bug report
description: Report a problem with Project Deck
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set `projectDeck.baseFolders` to ...
        2. Open the dashboard
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Project Deck version
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code version and OS
    validations:
      required: true
